# Generated by dotpanel; do not edit directly.
# Source: harness/codex/templates/config.toml
# Update: dotpanel configure --harness codex
#
# env_key style: api keys live in env (loaded by shell startup / VSCode
# server-env-setup via `dotpanel secrets export --scope llm`). VSCode Codex
# extension and command-line codex both read keys from env — no inline secrets.

model_provider = "andyfeng"
model = "gpt-5.5"
review_model = "gpt-5.5"
model_reasoning_effort = "xhigh"
disable_response_storage = true
network_access = "enabled"
windows_wsl_setup_acknowledged = true
model_context_window = 1000000
model_auto_compact_token_limit = 900000
preferred_auth_method = "apikey"
personality = "pragmatic"
approvals_reviewer = "user"

[model_providers.andyfeng]
name = "andyfeng"
base_url = "https://api.andyfeng.me"
wire_api = "responses"
env_key = "ANDYFENG_CODEX_KEY"

[model_providers.letaicode]
name = "letaicode"
base_url = "https://letaicode.cn/codex"
wire_api = "responses"
env_key = "LETAICODE_CODEX_KEY"

# Trusted project paths — populated from operator persona at configure time
[projects."/home/ubuntu"]
trust_level = "trusted"

[tui]
status_line = ["model-with-reasoning", "current-dir", "context-used"]

[tui.model_availability_nux]
claude-sonnet-4-6 = 4
"gpt-5.5" = 4

[plugins."cloudflare@openai-curated"]
enabled = false
